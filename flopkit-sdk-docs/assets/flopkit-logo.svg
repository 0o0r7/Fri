<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" fill="none">
  <!-- Background -->
  <rect width="480" height="120" rx="12" fill="#0a0f1a"/>

  <!-- Shield/Key icon -->
  <g transform="translate(28, 24)">
    <!-- Outer shield -->
    <path d="M36 4 L64 14 V36 C64 54 52 66 36 72 C20 66 8 54 8 36 V14 Z"
          fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner key circle -->
    <circle cx="36" cy="34" r="10" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <!-- Key shaft -->
    <line x1="36" y1="44" x2="36" y2="58" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
    <!-- Key teeth -->
    <line x1="36" y1="52" x2="42" y2="52" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="56" x2="40" y2="56" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
    <!-- Network nodes -->
    <circle cx="14" cy="14" r="2.5" fill="#3fb950"/>
    <circle cx="58" cy="14" r="2.5" fill="#3fb950"/>
    <circle cx="14" cy="58" r="2.5" fill="#3fb950"/>
    <circle cx="58" cy="58" r="2.5" fill="#3fb950"/>
    <!-- Network lines -->
    <line x1="14" y1="14" x2="58" y2="14" stroke="#3fb950" stroke-width="0.8" opacity="0.4"/>
    <line x1="14" y1="58" x2="58" y2="58" stroke="#3fb950" stroke-width="0.8" opacity="0.4"/>
    <line x1="14" y1="14" x2="14" y2="58" stroke="#3fb950" stroke-width="0.8" opacity="0.4"/>
    <line x1="58" y1="14" x2="58" y2="58" stroke="#3fb950" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Text: flopkit -->
  <text x="112" y="56" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="34" font-weight="700" fill="#e0e0e0" letter-spacing="-1">
    flopkit
  </text>

  <!-- Subtitle -->
  <text x="113" y="80" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="13" fill="#00e5ff" letter-spacing="2">
    SDK · CLI · MCP
  </text>

  <!-- Tagline -->
  <text x="113" y="98" font-family="-apple-system, system-ui, sans-serif"
        font-size="11" fill="#6b7280">
    Ed25519 DID identities &amp; signed AI-agent contributions
  </text>
</svg>
