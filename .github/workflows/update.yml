name: Update FRI

on:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "tests/**"
      - "requirements.txt"
      - "web/**"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: python -m collector.main --once --top 30

      - name: Sync data to web public
        run: bash scripts/sync_data.sh

      - name: Run tests
        run: pytest -q

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json web/public/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): update FRI rankings $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  build-web:
    needs: collect
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install + build web
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Verify build output
        working-directory: web
        run: |
          echo "Build output:"
          ls -la dist/
          echo ""
          echo "Data files:"
          ls -la dist/data/
          echo ""
          echo "Checking all 5 JSON files are present:"
          for f in latest.json dids.json kibble.json tclk.json reputation.json; do
            if [ ! -f "dist/data/$f" ]; then
              echo "ERROR: dist/data/$f is missing!"
              exit 1
            fi
            echo "  ✓ $f ($(wc -c < dist/data/$f) bytes)"
          done
