name: Update FRI

on:
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "tests/**"
      - "requirements.txt"
      - "web/**"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Retry the whole job up to 2 times on failure
    strategy:
      max-attempts: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector (resilient — degrades gracefully)
        # Never fails: if technocore is down, uses previous data.
        # If one room fails, continues with others.
        # Always writes all 5 JSON files + health.json.
        run: python -m collector.main --once --top 30
        continue-on-error: false

      - name: Sync data to web public
        run: bash scripts/sync_data.sh
        # Sync whatever we have, even if collector degraded
        continue-on-error: true

      - name: Run tests
        run: pytest -q
        continue-on-error: true
        # Tests don't block data refresh — if tests fail, data still goes live

      - name: Check health status
        run: |
          if [ -f data/health.json ]; then
            echo "=== Health status ==="
            cat data/health.json
            STATUS=$(python3 -c "import json; print(json.load(open('data/health.json')).get('status','unknown'))")
            echo ""
            echo "Overall status: $STATUS"
            if [ "$STATUS" = "failed" ]; then
              echo "⚠️ Collector failed — but data from previous run is still committed."
              echo "Site will show stale data. Next scheduled run will retry."
            fi
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json web/public/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            # Include health status in commit message
            STATUS="ok"
            if [ -f data/health.json ]; then
              STATUS=$(python3 -c "import json; print(json.load(open('data/health.json')).get('status','ok'))")
            fi
            git commit -m "chore(data): update FRI rankings $(date -u +%Y-%m-%dT%H:%MZ) [status:$STATUS]"
            git push
          fi

  build-web:
    needs: collect
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install + build web
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Verify build output
        working-directory: web
        run: |
          echo "Build output:"
          ls -la dist/
          echo ""
          echo "Data files:"
          ls -la dist/data/
          echo ""
          echo "Checking all 6 JSON files are present (5 data + health):"
          for f in latest.json dids.json kibble.json tclk.json reputation.json health.json; do
            if [ ! -f "dist/data/$f" ]; then
              echo "⚠️ dist/data/$f is missing (non-critical)"
            else
              echo "  ✓ $f ($(wc -c < dist/data/$f) bytes)"
            fi
          done
