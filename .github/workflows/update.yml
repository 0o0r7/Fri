name: Update FRI

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "tests/**"
      - "requirements.txt"
      - "web/**"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector (attempt 1)
        id: collector
        run: python -m collector.main --once --top 30
        continue-on-error: true

      - name: Run collector (retry if failed)
        if: steps.collector.outcome == 'failure'
        run: |
          echo "First attempt failed. Waiting 10s before retry..."
          sleep 10
          python -m collector.main --once --top 30

      - name: Sync data to web public
        run: bash scripts/sync_data.sh
        continue-on-error: true

      - name: Run tests
        run: pytest -q
        continue-on-error: true

      - name: Check health status
        run: |
          if [ -f data/health.json ]; then
            echo "=== Health status ==="
            cat data/health.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json web/public/data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            STATUS="ok"
            if [ -f data/health.json ]; then
              STATUS=$(python3 -c "import json; print(json.load(open('data/health.json')).get('status','ok'))")
            fi
            git commit -m "chore(data): update FRI $(date -u +%Y-%m-%dT%H:%MZ) [status:$STATUS]"
            git push
          fi

  build-web:
    needs: collect
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install + build web
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Verify build output
        working-directory: web
        run: |
          for f in latest.json dids.json kibble.json tclk.json reputation.json health.json; do
            if [ ! -f "dist/data/$f" ]; then
              echo "⚠️ dist/data/$f missing (non-critical)"
            else
              echo "  ✓ $f"
            fi
          done
