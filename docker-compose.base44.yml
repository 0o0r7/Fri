services:
  web:
    image: node:22
    working_dir: /app/web
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      - backend

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    command: sh -c "pip install -r backend/requirements.txt && uvicorn backend.app:app --reload --host 0.0.0.0 --port 8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pip-cache:
